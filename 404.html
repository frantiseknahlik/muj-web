<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — František Náhlík</title>
    <meta name="robots" content="noindex">
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000080'/%3E%3Cpath d='M22 20 10 32l12 12' fill='none' stroke='%23ffffff' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ctext x='37' y='42' font-family='monospace' font-weight='700' font-size='24' fill='%23ffffff' text-anchor='middle'%3EFN%3C/text%3E%3Ccircle cx='54' cy='18' r='4' fill='%23a9bfff'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #f8f6f1;
            --line: rgba(0, 0, 128, .08);
            --text: #0a0a33;
            --muted: #4b5573;
            --dim: #8890aa;
            --accent: #000080;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100svh;
            background: var(--bg);
            color: var(--text);
            font-family: 'Geist', system-ui, sans-serif;
            display: grid;
            place-items: center;
            padding: 24px 16px;
            overflow: hidden;
            background-image:
                linear-gradient(var(--line) 1px, transparent 1px),
                linear-gradient(90deg, var(--line) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        main {
            width: min(640px, 100%);
        }

        .code {
            font-size: clamp(120px, 34vw, 240px);
            font-weight: 600;
            letter-spacing: -0.07em;
            line-height: .8;
            margin-left: -0.05em;
        }

        .code em {
            font-style: normal;
            color: transparent;
            -webkit-text-stroke: 2px var(--accent);
        }

        .term {
            margin: 40px 0 32px;
            padding: 18px 20px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: #06104a;
            font-family: 'Geist Mono', monospace;
            font-size: 13px;
            line-height: 1.8;
            color: #c3cbef;
        }

        .term b {
            font-weight: 400;
            color: #a9bfff;
        }

        .term .r {
            color: #f87171;
        }

        .caret {
            animation: blink 1s steps(1) infinite;
            color: #a9bfff;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        a {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            height: 52px;
            padding: 0 26px;
            border-radius: 3px;
            background: var(--accent);
            color: #ffffff;
            font-weight: 500;
            text-decoration: none;
            transition: background-color .3s, color .3s;
        }

        a:hover {
            background: var(--text);
            color: var(--bg);
        }

        a:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }
    </style>
</head>

<body>
    <main>
        <h1 class="code">4<em>0</em>4</h1>
        <div class="term">
            <div><b>$</b> cd <span id="path">/tahle-stranka</span></div>
            <div class="r">cd: no such file or directory</div>
            <div><b>$</b> <span class="caret">▍</span></div>
        </div>
        <a href="/">Zpět na hlavní stránku →</a>
    </main>
    <script>
        document.getElementById('path').textContent = location.pathname || '/';
    </script>
</body>

</html>
